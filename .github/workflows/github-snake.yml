name: Generate contribution snake

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate custom snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sidhnath539
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff4fb8&color_dots=%232b102c,%234b1648,%236d1e61,%239d2f7f,%23ff4fb8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff4fb8&color_dots=%232b102c,%234b1648,%236d1e61,%239d2f7f,%23ff4fb8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution snake"
          
